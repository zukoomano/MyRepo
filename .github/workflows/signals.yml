name: Metal Signals

on:
  schedule:
    # After each M30 candle close (:00 and :30), +7 min. GitHub drops many scheduled runs
    # near the top of the hour and half-hour (its busiest minutes), so we avoid :00-:05 and :30-:35.
    # Only while the market is open (times in UTC):
    #   Sun 22:00 UTC (Mon 03:30 IST) -> Fri 22:00 UTC (Sat 03:30 IST)
    - cron: "7,37 22-23 * * 0"   # Sunday evening open
    - cron: "7,37 * * * 1-4"     # Monday to Thursday, all day
    - cron: "7,37 0-21 * * 5"    # Friday until the 22:00 UTC close
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: metal-signals
  cancel-in-progress: false

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run signal engine
        env:
          OANDA_KEY: ${{ secrets.OANDA_KEY }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          TG_TOKEN:  ${{ secrets.TG_TOKEN }}
          TG_CHAT:   ${{ secrets.TG_CHAT }}
        run: node run.js

      - name: Save state and signal log (so signals don't repeat and results are tracked)
        run: |
          if [ -n "$(git status --porcelain state.json signals.json signal-log.md)" ]; then
            git config user.name "signal-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json signals.json signal-log.md
            git commit -m "update signal state and log [skip ci]"
            git pull --rebase   # pick up any file you committed while this run was going
            git push
          else
            echo "No state change to commit."
          fi
